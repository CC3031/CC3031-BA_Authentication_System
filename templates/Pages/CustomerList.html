<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../static/Register.css">
    <title>Customer List</title>
</head>
<body>
<div class="customers">
    <h1>Rental Stuff LLC</h1>
    <h2>List of our customers</h2>

    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Access</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.first_name }}</td>
                <td>{{ user.last_name }}</td>
                <td>{{ user.access }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
</body>
</html>
